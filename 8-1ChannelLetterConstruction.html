<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Letter Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     The page fills exactly the height it is given and never more.
     Text and the button are fixed size; the image row absorbs
     whatever space is left over. In a short box the images
     shrink instead of the button falling off the bottom.
     ============================================================ */
  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only; normally nothing scrolls */
  }

  /* ---------- header block: fixed size ---------- */
  .head{flex:0 0 auto;}
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{
    height:4px;background:var(--psg-blue);
    width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);
  }
  .prompt{
    font-size:clamp(14px,min(2vw,2.7vh),20px);
    line-height:1.4;
    margin:0 0 3px;
    max-width:70ch;
  }
  .hint{
    font-size:clamp(11px,min(1.4vw,1.9vh),14px);
    color:#5A6B7D;
    margin:0;
  }

  /* ---------- diagram stage: absorbs leftover space ---------- */
  .stage{
    flex:1 1 auto;
    min-height:150px;            /* floor - never omit */
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .pic{
    position:relative;
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    overflow:hidden;
    flex:0 0 auto;
  }
  .pic img{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* Hotspots are positioned in percentages so they track the image
     as it scales. Each one sits over a red "Option" label. */
  .hot{
    position:absolute;
    background:transparent;
    border:3px solid transparent;
    border-radius:6px;
    padding:0;margin:0;
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .hot:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 0 0 3px rgba(7,124,171,.25);}
  .hot:focus-visible{outline:3px solid var(--psg-blue);outline-offset:2px;}
  .hot.chosen-correct{border-color:var(--correct);box-shadow:0 0 0 3px rgba(31,122,61,.35);}
  .hot.chosen-incorrect{border-color:var(--incorrect);box-shadow:0 0 0 3px rgba(179,38,30,.35);}
  .hot.locked{cursor:default;}

  /* ---------- completion screen ---------- */
  .done{
    display:none;
    flex:0 0 auto;
    flex-direction:column;
    align-items:flex-start;
    gap:clamp(8px,1.6vh,16px);
    background:var(--white);
    border:3px solid var(--card-gray);
    border-left:6px solid var(--correct);
    border-radius:10px;
    padding:clamp(12px,2.4vh,26px) clamp(14px,2vw,28px);
  }
  .done h2{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--correct);
    font-size:clamp(17px,min(2.6vw,3.6vh),26px);
    margin:0;
  }
  .done p{
    margin:0;
    font-size:clamp(14px,min(1.9vw,2.6vh),19px);
    line-height:1.45;
    max-width:60ch;
  }
  body.finished .stage,
  body.finished .response,
  body.finished .head .prompt,
  body.finished .head .hint{display:none;}
  body.finished .done{display:flex;}

  /* ---------- response block: fixed size, always reserved ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(96px,20vh,168px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{
    font-family:var(--font-head);
    font-weight:700;
    display:block;
    margin-bottom:2px;
    font-size:1.05em;
  }
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  button.retry{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  button.retry:hover{background:#066890;}
  button.retry:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  /* ============================================================
     NARROW SCREENS (phones, Trainual mobile app)
     ============================================================ */
  @media (max-width:700px){
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}
    .response{
      position:absolute;
      top:0;left:0;right:0;
      margin:0;
      padding:10px;
      min-height:0;
      z-index:5;
      background:transparent;
      pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);
      pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    .stage{min-height:140px;}
    .pic{border-width:2px;border-radius:8px;}
    .hot{border-width:2px;}
    .rule{margin-bottom:6px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
    .done{flex:0 0 auto;padding:12px 14px;border-width:2px;border-left-width:5px;gap:8px;}
    .done p{font-size:14px;line-height:1.4;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
  </div>

  <div class="stage" id="stage">
    <div class="pic" id="pic" role="group" aria-labelledby="q-prompt">
      <img id="pic-img" alt="">
    </div>
  </div>

  <div class="done" id="done" role="status" aria-live="polite">
    <h2 id="done-title"></h2>
    <p id="done-text"></p>
    <button class="retry" id="restart-btn" type="button"></button>
  </div>

  <div class="response" id="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button class="retry" id="action-btn" type="button">Try again</button>
    </div>
  </div>

</div>

<script>

                percent of the image: [left, top, width, height]
   questions  - one entry per question. "correct" is the hotspot
                number that is right. "feedback" has one line per

(function () {
  const stage   = document.getElementById("stage");
  const pic     = document.getElementById("pic");
  const img     = document.getElementById("pic-img");
  const fb      = document.getElementById("feedback");
  const verdict = document.getElementById("verdict");
  const explain = document.getElementById("explain");
  const actions = document.getElementById("actions");
  const btn     = document.getElementById("action-btn");
  const resp    = document.getElementById("response");
  const promptEl= document.getElementById("q-prompt");
  const hintEl  = document.getElementById("q-hint");
  const restartBtn = document.getElementById("restart-btn");
  document.getElementById("done-title").textContent = ACTIVITY.doneTitle;
  document.getElementById("done-text").textContent  = ACTIVITY.doneText;
  restartBtn.textContent = ACTIVITY.restartButton;

  document.getElementById("q-title").textContent = ACTIVITY.title;
  document.title = ACTIVITY.title;
  img.src = ACTIVITY.image.src;
  img.alt = ACTIVITY.image.alt;

  const W = ACTIVITY.image.width, H = ACTIVITY.image.height;
  const PAD = 1.2; /* extra percent around each label for easier tapping */

  const hots = {};
  Object.keys(ACTIVITY.hotspots).forEach(function (k) {
    const r = ACTIVITY.hotspots[k];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "hot";
    b.dataset.option = k;
    b.setAttribute("aria-label", "Option " + k);
    b.style.left   = Math.max(0, r[0] - PAD) + "%";
    b.style.top    = Math.max(0, r[1] - PAD) + "%";
    b.style.width  = Math.min(100 - Math.max(0, r[0] - PAD), r[2] + 2 * PAD) + "%";
    b.style.height = Math.min(100 - Math.max(0, r[1] - PAD), r[3] + 2 * PAD) + "%";
    b.addEventListener("click", function () { choose(k); });
    pic.appendChild(b);
    hots[k] = b;
  });

  /* Size the diagram to the largest box that fits the stage while
     keeping its aspect ratio, so the hotspots always line up. */
  function fit() {
    const r = stage.getBoundingClientRect();
    const border = 6;
    const s = Math.min((r.width - border) / W, (r.height - border) / H, 1.5);
    pic.style.width  = Math.max(40, W * s + border) + "px";
    pic.style.height = Math.max(40, H * s + border) + "px";
  }
  window.addEventListener("resize", fit);
  if ("ResizeObserver" in window) new ResizeObserver(fit).observe(stage);

  let qi = 0, locked = false, lastCorrect = false;

  function load(i) {
    qi = i;
    const q = ACTIVITY.questions[qi];
    promptEl.textContent = q.prompt;
    hintEl.textContent = "Question " + (qi + 1) + " of " + ACTIVITY.questions.length +
      " \u2014 select an option label on the diagram.";
    reset(false);
  }

  function choose(k) {
    if (locked) return;
    locked = true;
    const q = ACTIVITY.questions[qi];
    const ok = String(k) === String(q.correct);
    lastCorrect = ok;
    Object.keys(hots).forEach(function (j) { hots[j].classList.add("locked"); });
    hots[k].classList.add(ok ? "chosen-correct" : "chosen-incorrect");

    verdict.textContent = ok ? q.correctVerdict : q.incorrectVerdict;
    explain.textContent = q.feedback[k];
    fb.className = "feedback show " + (ok ? "correct" : "incorrect");

    if (!ok) btn.textContent = "Try again";
    else if (qi < ACTIVITY.questions.length - 1) btn.textContent = "Next question";
    else btn.textContent = ACTIVITY.finishButton;

    actions.className = "actions show";
    resp.classList.add("active");
    btn.focus({ preventScroll: true });
  }

  function reset(refocus) {
    locked = false;
    Object.keys(hots).forEach(function (j) { hots[j].className = "hot"; });
    fb.className = "feedback";
    actions.className = "actions";
    resp.classList.remove("active");
    if (refocus) hots[Object.keys(hots)[0]].focus({ preventScroll: true });
  }

  btn.addEventListener("click", function () {
    if (!lastCorrect) { reset(true); return; }
    lastCorrect = false;
    if (qi < ACTIVITY.questions.length - 1) {
      load(qi + 1);
      hots[Object.keys(hots)[0]].focus({ preventScroll: true });
    } else {
      reset(false);
      document.body.classList.add("finished");
      restartBtn.focus({ preventScroll: true });
    }
  });

  restartBtn.addEventListener("click", function () {
    document.body.classList.remove("finished");
    load(0);
    fit();
    hots[Object.keys(hots)[0]].focus({ preventScroll: true });
  });

  load(0);
  fit();
})();
</script>
