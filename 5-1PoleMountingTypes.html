<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice: Pole Mounting Methods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --psg-blue:#077CAB; --psg-navy:#0C2340; --card-gray:#EAEAEA;
    --page-bg:#F5F5F5; --white:#FFFFFF; --correct:#1F7A3D; --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{background:var(--page-bg);font-family:var(--font-body);color:var(--psg-navy);-webkit-font-smoothing:antialiased;}

  /* Fit-to-height: header and controls fixed, photo absorbs leftover space */
  .wrap{
    height:100%;max-width:1100px;margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);
    min-height:0;overflow:auto;position:relative;
  }
  .head{flex:0 0 auto;}
  .toprow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  h1{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(3vw,4.2vh),30px);line-height:1.15;margin:0 0 5px;}
  .count{font-family:var(--font-head);font-weight:600;font-size:clamp(11px,min(1.3vw,1.9vh),14px);color:#5A6B7D;white-space:nowrap;}
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.2vh,12px);}
  .prompt{font-size:clamp(14px,min(2vw,2.7vh),20px);line-height:1.38;margin:0;max-width:75ch;}

  /* Body: photo left, choices + feedback right */
  .body{flex:1 1 auto;min-height:150px;display:grid;grid-template-columns:minmax(0,45%) minmax(0,1fr);gap:clamp(10px,2vw,24px);}
  .body.noimg{grid-template-columns:minmax(0,1fr);}
  .stem{min-height:0;display:flex;align-items:center;justify-content:center;background:var(--white);border:3px solid var(--card-gray);border-radius:10px;padding:6px;overflow:hidden;}
  .stem img{width:100%;height:100%;object-fit:contain;display:block;min-height:0;}
  .body.noimg .stem{display:none;}
  .right{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);min-height:0;}
  .choices{display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);flex:0 0 auto;}
  .body.noimg .choices{display:grid;grid-template-columns:1fr 1fr;}
  .opt{
    font-family:var(--font-body);font-weight:600;color:var(--psg-navy);text-align:left;
    font-size:clamp(14px,min(1.8vw,2.5vh),18px);
    background:var(--white);border:3px solid var(--card-gray);border-radius:10px;
    min-height:44px;padding:clamp(6px,1.2vh,12px) 14px;cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* Feedback: space reserved so nothing reflows */
  .response{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;}
  .feedback{visibility:hidden;border-left:6px solid var(--psg-blue);background:var(--card-gray);border-radius:6px;
    padding:clamp(8px,1.4vh,14px) clamp(10px,1.4vw,16px);font-size:clamp(13px,min(1.6vw,2.3vh),17px);line-height:1.4;}
  .feedback.show{visibility:visible;}
  .feedback .verdict{font-family:var(--font-head);font-weight:700;display:block;margin-bottom:2px;font-size:1.05em;}
  .feedback.correct{border-left-color:var(--correct);} .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);} .feedback.incorrect .verdict{color:var(--incorrect);}
  .actions{visibility:hidden;display:flex;gap:8px;} .actions.show{visibility:visible;}
  button.act{font-family:var(--font-head);font-weight:600;font-size:clamp(13px,min(1.5vw,2vh),15px);color:var(--white);
    background:var(--psg-blue);border:none;border-radius:6px;padding:clamp(8px,1.2vh,11px) clamp(14px,1.8vw,22px);cursor:pointer;min-height:36px;}
  button.act:hover{background:#066890;}
  button.act:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}
  button.act[hidden]{display:none;}

  /* End screen */
  .done{display:none;flex:1 1 auto;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;}
  .wrap.finished .body,.wrap.finished .prompt,.wrap.finished .count{display:none;}
  .wrap.finished .done{display:flex;}
  .done p{margin:0;font-size:clamp(15px,min(2vw,2.8vh),20px);line-height:1.4;max-width:60ch;}

  /* Narrow screens: Trainual mobile app clips near 450px and won't scroll */
  @media (max-width:700px){
    .wrap{padding:8px 10px;gap:6px;max-height:430px;}
    h1{font-size:17px;margin-bottom:3px;}
    .rule{margin-bottom:5px;height:3px;}
    .prompt{font-size:14px;line-height:1.3;}
    .body{grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:8px;min-height:120px;}
    .stem{border-width:2px;padding:3px;border-radius:8px;}
    .choices{gap:4px;}
    .body.noimg .choices{grid-template-columns:1fr;}
    .opt{font-size:14px;min-height:42px;padding:6px 10px;border-width:2px;border-radius:8px;line-height:1.2;}
    /* Feedback pinned to the top as an overlay */
    .response{position:absolute;top:0;left:0;right:0;padding:10px;z-index:5;pointer-events:none;}
    .response.active{background:var(--page-bg);pointer-events:auto;box-shadow:0 6px 16px rgba(12,35,64,.14);border-radius:0 0 10px 10px;}
    .response:not(.active) .feedback,.response:not(.active) .actions{display:none;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <div class="toprow"><h1 id="title"></h1><span class="count" id="count"></span></div>
    <div class="rule"></div>
    <p class="prompt" id="prompt"></p>
  </div>

  <div class="body" id="body">
    <div class="stem"><img id="stem" alt=""></div>
    <div class="right">
      <div class="choices" id="choices" role="group" aria-labelledby="prompt"></div>
      <div class="response" id="response">
        <div class="feedback" id="feedback" role="status" aria-live="polite">
          <span class="verdict" id="verdict"></span><span id="explain"></span>
        </div>
        <div class="actions" id="actions">
          <button class="act" id="retry" type="button">Try again</button>
          <button class="act" id="next" type="button">Next question</button>
        </div>
      </div>
    </div>
  </div>

  <div class="done" id="done">
    <p id="doneText"></p>
    <button class="act" id="restart" type="button">Start over</button>
  </div>
</div>

(function () {
  const $ = function (id) { return document.getElementById(id); };
  const wrap = $("wrap"), body = $("body"), stem = $("stem"), choices = $("choices"),
        response = $("response"), fb = $("feedback"), verdict = $("verdict"), explain = $("explain"),
        actions = $("actions"), retry = $("retry"), next = $("next");
  let qi = 0, missed = false, firstTry = 0, cards = [];

  $("title").textContent = TITLE; document.title = TITLE;

  function render() {
    const q = QUESTIONS[qi];
    missed = false;
    $("count").textContent = "Question " + (qi + 1) + " of " + QUESTIONS.length;
    $("prompt").textContent = q.prompt;
    if (q.img) { body.classList.remove("noimg"); stem.src = q.img; stem.alt = q.alt; }
    else { body.classList.add("noimg"); stem.removeAttribute("src"); stem.alt = ""; }
    choices.innerHTML = "";
    cards = q.options.map(function (o, i) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = o.text;
      b.addEventListener("click", function () { choose(i); });
      choices.appendChild(b); return b;
    });
    reset();
  }

  function choose(i) {
    if (choices.dataset.locked === "1") return;
    const q = QUESTIONS[qi], o = q.options[i];
    choices.dataset.locked = "1";
    cards.forEach(function (c, j) {
      c.classList.add("locked");
      c.classList.add(j === i ? (o.correct ? "chosen-correct" : "chosen-incorrect") : "dimmed");
    });
    if (o.correct && !missed) firstTry++;
    if (!o.correct) missed = true;
    verdict.textContent = o.correct ? q.right : q.wrong;
    explain.textContent = " " + o.feedback;
    fb.className = "feedback show " + (o.correct ? "correct" : "incorrect");
    retry.hidden = !!o.correct;
    next.hidden = !o.correct;
    next.textContent = qi === QUESTIONS.length - 1 ? "See results" : "Next question";
    actions.className = "actions show";
    response.classList.add("active");
    (o.correct ? next : retry).focus({ preventScroll: true });
  }

  function reset() {
    choices.dataset.locked = "0";
    cards.forEach(function (c) { c.className = "opt"; });
    fb.className = "feedback"; actions.className = "actions";
    response.classList.remove("active");
  }

  retry.addEventListener("click", function () { reset(); cards[0].focus({ preventScroll: true }); });
  next.addEventListener("click", function () {
    if (qi < QUESTIONS.length - 1) { qi++; render(); }
    else {
      wrap.classList.add("finished");
      $("doneText").textContent = "You finished the pole mounting practice! You got " + firstTry + " of " +
        QUESTIONS.length + " right on the first try. Review any methods you missed, then continue to the next page.";
      $("restart").focus({ preventScroll: true });
    }
  });
  $("restart").addEventListener("click", function () {
    wrap.classList.remove("finished"); qi = 0; firstTry = 0; render();
  });
  render();
})();
</script>
