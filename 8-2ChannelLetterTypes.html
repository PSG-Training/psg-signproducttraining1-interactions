<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Letter Type Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     The page fills exactly the height it is given and never more.
     Text and the button are fixed size; the image row absorbs
     whatever space is left over. In a short box the images
     shrink instead of the button falling off the bottom.
     ============================================================ */
  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only; normally nothing scrolls */
  }

  /* ---------- header block: fixed size ---------- */
  .head{flex:0 0 auto;}
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{
    height:4px;background:var(--psg-blue);
    width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);
  }
  .prompt{
    font-size:clamp(14px,min(2vw,2.7vh),20px);
    line-height:1.4;
    margin:0 0 3px;
    max-width:70ch;
  }
  .hint{
    font-size:clamp(11px,min(1.4vw,1.9vh),14px);
    color:#5A6B7D;
    margin:0;
  }

  /* ---------- option row: absorbs leftover space ---------- */
  .options{
    flex:1 1 auto;
    /* Hard floor: the row may shrink, but never below this. If the
       frame is too short to honour it, .wrap scrolls instead. */
    min-height:150px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:clamp(8px,1.4vw,18px);
    align-content:stretch;
  }
  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){
    border-color:var(--psg-blue);
    box-shadow:0 4px 14px rgba(12,35,64,.12);
  }
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .opt .label{
    flex:0 0 auto;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);
    color:#5A6B7D;
  }

  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* ---------- response block: fixed size, always reserved ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(96px,20vh,168px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{
    font-family:var(--font-head);
    font-weight:700;
    display:block;
    margin-bottom:2px;
    font-size:1.05em;
  }
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  button.retry{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  button.retry:hover{background:#066890;}
  button.retry:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  /* ---------- question body: holds stem + options ---------- */
  .qbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);}
  .stem{
    display:none;
    flex:1 1 auto;
    min-height:120px;
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(4px,1vh,10px);
  }
  .stem img{width:100%;height:100%;object-fit:contain;display:block;}
  .qbody.text .stem{display:block;}
  .qbody.text .options{
    flex:0 0 auto;
    min-height:0;
    grid-template-columns:repeat(3,1fr);
  }
  .opt.txt{
    justify-content:center;
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(14px,min(1.8vw,2.6vh),18px);
    padding:clamp(8px,1.6vh,14px) 8px;
  }

  /* ---------- completion screen ---------- */
  .done{
    display:none;
    flex:0 0 auto;
    flex-direction:column;
    align-items:flex-start;
    gap:clamp(8px,1.6vh,16px);
    background:var(--white);
    border:3px solid var(--card-gray);
    border-left:6px solid var(--correct);
    border-radius:10px;
    padding:clamp(12px,2.4vh,26px) clamp(14px,2vw,28px);
  }
  .done h2{font-family:var(--font-head);font-weight:700;color:var(--correct);font-size:clamp(17px,min(2.6vw,3.6vh),26px);margin:0;}
  .done p{margin:0;font-size:clamp(14px,min(1.9vw,2.6vh),19px);line-height:1.45;max-width:60ch;}
  body.finished .qbody,
  body.finished .response,
  body.finished .head .prompt,
  body.finished .head .hint{display:none;}
  body.finished .done{display:flex;}

  /* ============================================================
     NARROW SCREENS (phones, Trainual mobile app)
     ============================================================ */
  @media (max-width:700px){
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}
    .response{
      position:absolute;top:0;left:0;right:0;margin:0;padding:10px;
      min-height:0;z-index:5;background:transparent;pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);border-radius:0 0 10px 10px;
    }
    /* Sign photos are wide, so on phones the photo options stack in
       three short rows (photo left, label right) instead of three
       narrow columns. Rows share the leftover height equally. */
    .options{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;min-height:150px;}
    .opt{padding:4px 8px;border-width:2px;border-radius:8px;gap:8px;flex-direction:row;}
    .opt img{width:auto;flex:1 1 auto;min-width:0;}
    .opt .label{font-size:10px;letter-spacing:.02em;flex:0 0 52px;text-align:center;}
    .qbody.text .options{grid-template-rows:auto;grid-template-columns:repeat(3,1fr);}
    .opt.txt{font-size:14px;padding:9px 4px;}
    .stem{min-height:90px;max-height:150px;border-width:2px;border-radius:8px;padding:3px;}
    .rule{margin-bottom:6px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
    .done{padding:12px 14px;border-width:2px;border-left-width:5px;gap:8px;}
    .done p{font-size:14px;line-height:1.4;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
  </div>

  <div class="qbody" id="qbody">
    <div class="stem" id="stem"><img id="stem-img" alt=""></div>
    <div class="options" id="options" role="group" aria-labelledby="q-prompt"></div>
  </div>

  <div class="done" id="done" role="status" aria-live="polite">
    <h2 id="done-title"></h2>
    <p id="done-text"></p>
    <button class="retry" id="restart-btn" type="button"></button>
  </div>

  <div class="response" id="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button class="retry" id="action-btn" type="button">Try again</button>
    </div>
  </div>

</div>

   ================================================================ */

(function () {
  const qbody   = document.getElementById("qbody");
  const grid    = document.getElementById("options");
  const stem    = document.getElementById("stem-img");
  const fb      = document.getElementById("feedback");
  const verdict = document.getElementById("verdict");
  const explain = document.getElementById("explain");
  const actions = document.getElementById("actions");
  const btn     = document.getElementById("action-btn");
  const resp    = document.getElementById("response");
  const restart = document.getElementById("restart-btn");

  document.getElementById("q-title").textContent = ACTIVITY.title;
  document.title = ACTIVITY.title;
  document.getElementById("done-title").textContent = ACTIVITY.doneTitle;
  document.getElementById("done-text").textContent  = ACTIVITY.doneText;
  restart.textContent = ACTIVITY.restartButton;

  let qi = 0, cards = [], locked = false, lastCorrect = false;

  function load(i) {
    qi = i;
    const q = ACTIVITY.questions[qi];
    const isText = !!q.stem;
    qbody.className = "qbody" + (isText ? " text" : "");
    document.getElementById("q-prompt").textContent = q.prompt;
    document.getElementById("q-hint").textContent =
      "Question " + (qi + 1) + " of " + ACTIVITY.questions.length + " \u2014 " +
      (isText ? "select an answer." : "select an image.");
    if (isText) { stem.src = q.stem.src; stem.alt = q.stem.alt; }
    else { stem.removeAttribute("src"); stem.alt = ""; }

    grid.innerHTML = "";
    cards = q.options.map(function (o, k) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt" + (isText ? " txt" : "");
      if (isText) {
        b.textContent = o.text;
      } else {
        b.setAttribute("aria-label", o.label + ": " + o.alt);
        const img = document.createElement("img");
        img.src = o.src; img.alt = o.alt;
        const lab = document.createElement("span");
        lab.className = "label"; lab.textContent = o.label;
        b.appendChild(img); b.appendChild(lab);
      }
      b.addEventListener("click", function () { choose(k); });
      grid.appendChild(b);
      return b;
    });
    reset(false);
  }

  function choose(k) {
    if (locked) return;
    locked = true;
    const q = ACTIVITY.questions[qi], o = q.options[k];
    lastCorrect = !!o.correct;
    cards.forEach(function (c, j) {
      c.classList.add("locked");
      if (j === k) c.classList.add(o.correct ? "chosen-correct" : "chosen-incorrect");
      else c.classList.add("dimmed");
    });
    verdict.textContent = o.correct ? q.correctVerdict : q.incorrectVerdict;
    explain.textContent = o.feedback;
    fb.className = "feedback show " + (o.correct ? "correct" : "incorrect");
    if (!o.correct) btn.textContent = "Try again";
    else if (qi < ACTIVITY.questions.length - 1) btn.textContent = "Next question";
    else btn.textContent = ACTIVITY.finishButton;
    actions.className = "actions show";
    resp.classList.add("active");
    btn.focus({ preventScroll: true });
  }

  function reset(refocus) {
    locked = false;
    cards.forEach(function (c) { c.classList.remove("locked","chosen-correct","chosen-incorrect","dimmed"); });
    fb.className = "feedback";
    actions.className = "actions";
    resp.classList.remove("active");
    if (refocus && cards[0]) cards[0].focus({ preventScroll: true });
  }

  btn.addEventListener("click", function () {
    if (!lastCorrect) { reset(true); return; }
    lastCorrect = false;
    if (qi < ACTIVITY.questions.length - 1) {
      load(qi + 1);
      cards[0].focus({ preventScroll: true });
    } else {
      reset(false);
      document.body.classList.add("finished");
      restart.focus({ preventScroll: true });
    }
  });

  restart.addEventListener("click", function () {
    document.body.classList.remove("finished");
    load(0);
    cards[0].focus({ preventScroll: true });
  });

  load(0);
})();
</script>
