<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice with Awning Shapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     The page fills exactly the height it is given and never more.
     Text and the button are fixed size; the image row absorbs
     whatever space is left over. In a short box the images
     shrink instead of the button falling off the bottom.
     ============================================================ */
  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only; normally nothing scrolls */
  }

  /* ---------- header block: fixed size ---------- */
  .head{flex:0 0 auto;}
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{
    height:4px;background:var(--psg-blue);
    width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);
  }
  .prompt{
    font-size:clamp(14px,min(2vw,2.7vh),20px);
    line-height:1.4;
    margin:0 0 3px;
    max-width:70ch;
  }
  .count{
    font-family:var(--font-head);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--psg-blue);font-size:clamp(10px,min(1.2vw,1.7vh),13px);margin:0 0 2px;
  }
  .hint{
    font-size:clamp(11px,min(1.4vw,1.9vh),14px);
    color:#5A6B7D;
    margin:0;
  }

  /* ---------- option row: absorbs leftover space ---------- */
  .options{
    flex:1 1 auto;
    /* Hard floor: the row may shrink, but never below this. If the
       frame is too short to honour it, .wrap scrolls instead. */
    min-height:150px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:clamp(8px,1.4vw,18px);
    align-content:stretch;
  }
  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){
    border-color:var(--psg-blue);
    box-shadow:0 4px 14px rgba(12,35,64,.12);
  }
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .opt .label{
    flex:0 0 auto;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);
    color:#5A6B7D;
  }

  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* ---------- response block: fixed size, always reserved ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(96px,20vh,168px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{
    font-family:var(--font-head);
    font-weight:700;
    display:block;
    margin-bottom:2px;
    font-size:1.05em;
  }
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  button.retry{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  button.retry:hover{background:#066890;}
  button.retry:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  /* ---------- completion screen ---------- */
  .done{display:none;flex:0 0 auto;}
  .wrap.finished .head,.wrap.finished .options,.wrap.finished .response{display:none;}
  .wrap.finished .done{display:block;}
  .done-card{background:var(--white);border:3px solid var(--card-gray);border-left:6px solid var(--correct);
    border-radius:10px;padding:clamp(14px,2.4vh,26px) clamp(14px,2vw,26px);max-width:620px;}
  .done-card h2{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(2.6vw,3.6vh),26px);
    margin:0 0 6px;color:var(--correct);}
  .done-card p{font-size:clamp(14px,min(1.8vw,2.5vh),18px);line-height:1.4;margin:0 0 clamp(10px,1.8vh,18px);}

  /* ============================================================
     NARROW SCREENS (phones, Trainual mobile app)
     Three across instead of stacked. Roughly a third of the
     height, so everything still fits in a short frame.
     ============================================================ */
  @media (max-width:700px){
    /* The Trainual mobile app clips the frame near 450px. Cap our own
       layout below that so content is never laid out into space the
       learner will not be shown. Any extra frame height is left empty
       and clipped harmlessly. */
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}

    /* The Trainual mobile app clips the frame and will not scroll
       inside it. So feedback is pinned to the TOP, where it is
       always visible, instead of sitting below the images. */
    .response{
      position:absolute;
      top:0;left:0;right:0;
      margin:0;
      padding:10px;
      min-height:0;
      z-index:5;
      background:transparent;
      pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);
      pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    .options{
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      min-height:118px;
    }
    .opt{padding:5px;border-width:2px;border-radius:8px;gap:3px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .rule{margin-bottom:6px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="head">
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="count" id="q-count"></p>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint">Select an image to check your answer.</p>
  </div>

  <div class="options" id="options" role="group" aria-labelledby="q-prompt"></div>

  <div class="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button class="retry" id="retry" type="button">Try again</button>
    </div>
  </div>

  <div class="done">
    <div class="done-card">
      <h2 id="done-title"></h2>
      <p id="done-text"></p>
      <button class="retry" id="restart" type="button">Start over</button>
    </div>
  </div>

</div>

(function () {
  const $ = function (id) { return document.getElementById(id); };
  const wrap = $("wrap") || document.querySelector(".wrap");
  const grid = $("options"), fb = $("feedback"), verdict = $("verdict"), explain = $("explain");
  const actions = $("actions"), actBtn = $("retry"), response = document.querySelector(".response");
  let qi = 0, cards = [], firstTry = true, score = 0, lastRight = false;

  $("q-title").textContent = ACTIVITY.title;
  document.title = ACTIVITY.title;

  function render() {
    const q = QUESTIONS[qi];
    firstTry = true;
    $("q-count").textContent = "Question " + (qi + 1) + " of " + QUESTIONS.length;
    $("q-prompt").textContent = q.prompt;
    grid.innerHTML = "";
    cards = q.options.map(function (o, i) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt";
      b.setAttribute("aria-label", o.label + ": " + o.alt);
      const img = document.createElement("img"); img.src = o.src; img.alt = o.alt;
      const lab = document.createElement("span"); lab.className = "label"; lab.textContent = o.label;
      b.appendChild(img); b.appendChild(lab);
      b.addEventListener("click", function () { choose(i); });
      grid.appendChild(b);
      return b;
    });
    reset();
  }

  function choose(i) {
    if (grid.dataset.locked === "1") return;
    const q = QUESTIONS[qi], opt = q.options[i];
    grid.dataset.locked = "1";
    cards.forEach(function (c, j) {
      c.classList.add("locked");
      c.classList.add(j === i ? (opt.correct ? "chosen-correct" : "chosen-incorrect") : "dimmed");
    });
    if (opt.correct && firstTry) score++;
    if (!opt.correct) firstTry = false;
    lastRight = opt.correct;
    verdict.textContent = opt.correct ? q.verdicts.right : q.verdicts.wrong;
    explain.textContent = opt.feedback;
    fb.className = "feedback show " + (opt.correct ? "correct" : "incorrect");
    actBtn.textContent = opt.correct
      ? (qi === QUESTIONS.length - 1 ? ACTIVITY.finishLabel : ACTIVITY.nextLabel)
      : ACTIVITY.retryLabel;
    actions.className = "actions show";
    response.classList.add("active");
    actBtn.focus({ preventScroll: true });
  }

  function reset() {
    grid.dataset.locked = "0";
    cards.forEach(function (c) { c.className = "opt"; });
    fb.className = "feedback";
    actions.className = "actions";
    response.classList.remove("active");
  }

  actBtn.addEventListener("click", function () {
    if (!lastRight) { reset(); cards[0].focus({ preventScroll: true }); return; }
    if (qi < QUESTIONS.length - 1) { qi++; render(); cards[0].focus({ preventScroll: true }); return; }
    wrap.classList.add("finished");
    $("done-title").textContent = ACTIVITY.doneTitle;
    $("done-text").textContent = ACTIVITY.doneText
      .replace("{score}", score).replace("{total}", QUESTIONS.length);
    $("restart").focus({ preventScroll: true });
  });

  $("restart").addEventListener("click", function () {
    wrap.classList.remove("finished");
    qi = 0; score = 0; render();
    cards[0].focus({ preventScroll: true });
  });

  render();
})();
</script>
