<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;
  }

  /* ---------- header ---------- */
  .head{flex:0 0 auto;}
  .headbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 0 2px;
  }
  .steps{
    font-family:var(--font-head);
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:clamp(9px,min(1.1vw,1.5vh),12px);
    color:var(--psg-blue);
    margin:0;
  }
  /* The advance control for the review stage lives up here, not below
     the cards, so it is always inside the mobile app's visible window. */
  button.go{
    visibility:hidden;
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(11px,min(1.3vw,1.7vh),13px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:6px 12px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.go.show{visibility:visible;}
  button.go:hover{background:#066890;}
  button.go:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);}
  .prompt{
    font-size:clamp(14px,min(2vw,2.7vh),20px);
    line-height:1.4;
    margin:0 0 3px;
    max-width:70ch;
  }
  .hint{font-size:clamp(11px,min(1.4vw,1.9vh),14px);color:#5A6B7D;margin:0;}

  /* ---------- option region: absorbs leftover space ---------- */
  .options{
    flex:1 1 auto;
    min-height:150px;
    display:grid;
    gap:clamp(8px,1.4vw,18px);
    align-content:stretch;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  }
  .options.text{
    grid-template-columns:1fr;
    gap:clamp(6px,1.1vh,12px);
    align-content:start;
    min-height:120px;
  }

  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{flex:1 1 auto;min-height:0;width:100%;height:100%;object-fit:contain;display:block;}
  .opt .label{
    flex:0 0 auto;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);
    color:#5A6B7D;
    text-align:center;
    line-height:1.2;
  }
  /* review cards name the frame, so the label carries more weight */
  .opt.card .label{
    font-family:var(--font-head);
    color:var(--psg-navy);
    letter-spacing:.03em;
  }
  .opt.card.seen .label::after{content:" \2713";color:var(--correct);}
  .opt.open{border-color:var(--psg-blue);background:#F2F9FC;}

  /* text answer rows */
  .opt.row{
    flex-direction:row;
    align-items:center;
    gap:10px;
    padding:clamp(8px,1.5vh,16px) clamp(10px,1.6vw,18px);
    text-align:left;
    font-size:clamp(13px,min(1.7vw,2.3vh),18px);
    line-height:1.3;
    /* Floor the tap target. A text row renders about 37px tall on its
       own, under the ~44px minimum for a reliable finger tap. */
    min-height:clamp(48px,8vh,80px);
  }
  .opt.row .key{
    flex:0 0 auto;
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-blue);
    width:1.4em;
  }
  .opt.row .text{flex:1 1 auto;font-weight:600;}

  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-correct .key{color:var(--correct);}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.chosen-incorrect .key{color:var(--incorrect);}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* ---------- response block: fixed size, always reserved ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(96px,20vh,168px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{
    font-family:var(--font-head);
    font-weight:700;
    display:block;
    margin-bottom:2px;
    font-size:1.05em;
    color:var(--psg-blue);
  }
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  button.act{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  button.act:hover{background:#066890;}
  button.act:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  /* ============================================================
     NARROW SCREENS (phones, Trainual mobile app)
     ============================================================ */
  @media (max-width:700px){
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}
    .response{
      position:absolute;
      top:0;left:0;right:0;
      margin:0;
      padding:10px;
      min-height:0;
      z-index:5;
      background:transparent;
      pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);
      pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    /* Photo options go three across. Review cards go two across and two
       down, because four across leaves each photo about 85px wide. The
       row is capped so a narrow card is not stretched tall around a
       small picture. */
    .options{grid-template-columns:repeat(3,1fr);gap:6px;min-height:118px;max-height:250px;}
    .options.cards{grid-template-columns:repeat(2,1fr);max-height:300px;}
    .options.text{grid-template-columns:1fr;gap:5px;min-height:110px;max-height:none;}
    .opt{padding:5px;border-width:2px;border-radius:8px;gap:3px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .opt.card .label{font-size:10px;}
    .opt.row{padding:8px 10px;font-size:13px;min-height:48px;}
    .rule{margin-bottom:6px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="headbar">
      <p class="steps" id="steps"></p>
      <button class="go" id="gobtn" type="button">Start the questions</button>
    </div>
    <h1 id="title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="prompt"></p>
    <p class="hint" id="hint"></p>
  </div>

  <div class="options" id="options" role="group" aria-labelledby="prompt"></div>

  <div class="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button class="act" id="actbtn" type="button">Try again</button>
    </div>
  </div>

</div>

/* ================================================================
   NO EDITS NEEDED BELOW THIS LINE
   ================================================================ */

(function () {
  const grid     = document.getElementById("options");
  const fb       = document.getElementById("feedback");
  const verdict  = document.getElementById("verdict");
  const explain  = document.getElementById("explain");
  const actions  = document.getElementById("actions");
  const actBtn   = document.getElementById("actbtn");
  const goBtn    = document.getElementById("gobtn");
  const steps    = document.getElementById("steps");
  const titleEl  = document.getElementById("title");
  const promptEl = document.getElementById("prompt");
  const hintEl   = document.getElementById("hint");
  const response = document.querySelector(".response");
  const KEYS     = ["A", "B", "C", "D"];

  const total = QUIZ.questions.length;
  let stage = "review";   // "review" or a question index
  let qi = 0;
  let cards = [];
  let pending = null;
  const seen = [];

  function clearResponse() {
    fb.className = "feedback";
    actions.className = "actions";
    response.classList.remove("active");
    pending = null;
  }

  function build(children) {
    grid.innerHTML = "";
    cards = children.map(function (el) { grid.appendChild(el); return el; });
  }

  /* ---------------- review stage ---------------- */
  function renderReview() {
    stage = "review";
    steps.textContent = REVIEW.stepLabel;
    titleEl.textContent = REVIEW.title;
    promptEl.textContent = REVIEW.prompt;
    hintEl.textContent = REVIEW.hint;
    document.title = REVIEW.title;
    goBtn.textContent = REVIEW.goLabel;
    goBtn.className = "go show";
    grid.className = "options cards";

    build(REVIEW.items.map(function (item, i) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt card" + (seen.indexOf(i) > -1 ? " seen" : "");
      b.setAttribute("aria-label", item.name + " frame: " + item.alt);

      const img = document.createElement("img");
      img.src = item.src;
      img.alt = item.alt;

      const lab = document.createElement("span");
      lab.className = "label";
      lab.textContent = item.name;

      b.appendChild(img);
      b.appendChild(lab);
      b.addEventListener("click", function () { openCard(i); });
      return b;
    }));
    clearResponse();
  }

  function openCard(i) {
    const item = REVIEW.items[i];
    if (seen.indexOf(i) === -1) seen.push(i);
    cards.forEach(function (c, j) { c.classList.toggle("open", j === i); });
    cards[i].classList.add("seen");

    verdict.textContent = item.name + " Frame";
    explain.textContent = item.text;
    fb.className = "feedback show";
    actBtn.textContent = REVIEW.closeLabel;
    pending = "close";
    actions.className = "actions show";
    response.classList.add("active");
    actBtn.focus({ preventScroll: true });
  }

  /* ---------------- question stages ---------------- */
  function renderQuestion() {
    const q = QUIZ.questions[qi];
    stage = qi;
    steps.textContent = "Question " + (qi + 1) + " of " + total;
    titleEl.textContent = q.title;
    promptEl.textContent = q.prompt;
    hintEl.textContent = q.hint;
    document.title = q.title;
    goBtn.className = "go";
    grid.className = "options" + (q.kind === "text" ? " text" : "");
    grid.dataset.locked = "0";

    build(q.options.map(function (o, i) {
      const b = document.createElement("button");
      b.type = "button";

      if (q.kind === "text") {
        b.className = "opt row";
        b.setAttribute("aria-label", KEYS[i] + ": " + o.text);

        const key = document.createElement("span");
        key.className = "key";
        key.textContent = KEYS[i];

        const txt = document.createElement("span");
        txt.className = "text";
        txt.textContent = o.text;

        b.appendChild(key);
        b.appendChild(txt);
      } else {
        b.className = "opt";
        b.setAttribute("aria-label", o.label + ": " + o.alt);

        const img = document.createElement("img");
        img.src = o.src;
        img.alt = o.alt;

        const lab = document.createElement("span");
        lab.className = "label";
        lab.textContent = o.label;

        b.appendChild(img);
        b.appendChild(lab);
      }

      b.addEventListener("click", function () { choose(i); });
      return b;
    }));
    clearResponse();
  }

  function choose(i) {
    if (grid.dataset.locked === "1") return;
    const q = QUIZ.questions[qi];
    const opt = q.options[i];
    grid.dataset.locked = "1";

    cards.forEach(function (c, j) {
      c.classList.add("locked");
      c.classList.add(j === i ? (opt.correct ? "chosen-correct" : "chosen-incorrect") : "dimmed");
    });

    verdict.textContent = opt.correct ? q.correctVerdict : q.incorrectVerdict;
    explain.textContent = opt.feedback;
    fb.className = "feedback show " + (opt.correct ? "correct" : "incorrect");

    if (opt.correct) {
      const last = qi === total - 1;
      actBtn.textContent = last ? QUIZ.restartLabel : QUIZ.nextLabel;
      pending = last ? "restart" : "next";
    } else {
      actBtn.textContent = QUIZ.retryLabel;
      pending = "retry";
    }
    actions.className = "actions show";
    response.classList.add("active");
    actBtn.focus({ preventScroll: true });
  }

  /* ---------------- controls ---------------- */
  goBtn.addEventListener("click", function () {
    qi = 0;
    renderQuestion();
    cards[0].focus({ preventScroll: true });
  });

  actBtn.addEventListener("click", function () {
    if (pending === "close") {
      cards.forEach(function (c) { c.classList.remove("open"); });
      clearResponse();
      cards[0].focus({ preventScroll: true });
    } else if (pending === "retry") {
      const keep = QUIZ.questions[qi].kind === "text" ? "opt row" : "opt";
      grid.dataset.locked = "0";
      cards.forEach(function (c) { c.className = keep; });
      clearResponse();
      cards[0].focus({ preventScroll: true });
    } else if (pending === "next") {
      qi += 1;
      renderQuestion();
      cards[0].focus({ preventScroll: true });
    } else {
      seen.length = 0;
      renderReview();
      cards[0].focus({ preventScroll: true });
    }
  });

  renderReview();
})();
</script>
