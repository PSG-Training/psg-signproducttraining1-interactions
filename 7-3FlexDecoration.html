<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice with Decoration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     ============================================================ */
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only */
  }

  /* ---------- header ---------- */
  .head{flex:0 0 auto;}
  .progress{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(10px,min(1.3vw,1.8vh),13px);
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--psg-blue);
    margin:0 0 3px;
  }
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);}
  .prompt{font-size:clamp(14px,min(2vw,2.7vh),20px);line-height:1.4;margin:0 0 3px;max-width:75ch;}
  .hint{font-size:clamp(11px,min(1.4vw,1.9vh),14px);color:#5A6B7D;margin:0;}

  /* ---------- options ---------- */
  .options{
    display:grid;
    gap:clamp(8px,1.4vw,18px);
  }
  /* Image questions: the row absorbs leftover height, with a floor */
  .options.images{
    flex:1 1 auto;
    min-height:150px;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    align-content:stretch;
  }
  /* Text questions: stacked, natural height */
  .options.texts{
    flex:0 0 auto;
    grid-template-columns:1fr;
    max-width:780px;
    gap:clamp(6px,1.1vh,12px);
  }
  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{flex:1 1 auto;min-height:0;width:100%;height:100%;object-fit:contain;display:block;}
  .opt .label{
    flex:0 0 auto;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);color:#5A6B7D;
  }
  .options.texts .opt{
    flex-direction:row;
    align-items:center;
    text-align:left;
    gap:10px;
    padding:clamp(8px,1.4vh,14px) clamp(10px,1.4vw,16px);
  }
  .opt .letter{
    flex:0 0 auto;
    font-family:var(--font-head);font-weight:700;
    font-size:clamp(12px,min(1.5vw,2vh),15px);
    color:var(--white);background:var(--psg-blue);
    width:1.9em;height:1.9em;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .opt .txt{font-size:clamp(14px,min(1.9vw,2.5vh),18px);line-height:1.35;}

  /* Diagram questions: picture + letter buttons share the flexible region */
  .stage{
    flex:1 1 auto;
    min-height:170px;
    display:flex;
    gap:clamp(10px,2vw,28px);
    align-items:stretch;
  }
  .stage.mode-text{flex:0 0 auto;min-height:0;display:block;}
  .stage.mode-image .options.images{flex:1 1 auto;width:100%;}
  .stage:not(.mode-diagram):not(.mode-picture) .diagram{display:none;}
  .diagram{
    flex:1 1 auto;
    min-width:0;min-height:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,12px);
  }
  .hotwrap{position:relative;flex:0 0 auto;}
  .hotwrap img{width:100%;height:100%;display:block;}
  .opt.hot{
    position:absolute;
    padding:0;
    background:transparent;
    border:3px solid transparent;
    border-radius:8px;
    min-height:0;
  }
  .opt.hot:hover:not(.locked){border-color:var(--psg-blue);background:rgba(7,124,171,.12);box-shadow:none;}
  .opt.hot.chosen-correct{border-color:var(--correct);background:rgba(31,122,61,.22);}
  .opt.hot.chosen-incorrect{border-color:var(--incorrect);background:rgba(179,38,30,.18);}
  .opt.hot.dimmed{opacity:1;background:rgba(245,245,245,.45);}
  .stage.mode-diagram .options{display:none;}
  .options.letters{
    flex:0 0 clamp(120px,18vw,190px);
    grid-template-columns:1fr;
    align-content:center;
    gap:clamp(8px,1.4vh,14px);
  }
  .options.letters .opt{
    flex-direction:row;justify-content:center;
    font-family:var(--font-head);font-weight:700;
    font-size:clamp(18px,min(2.6vw,3.6vh),28px);
    padding:clamp(6px,1.2vh,12px);
    min-height:44px;
  }

  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* ---------- response: reserved space, never reflows ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(110px,22vh,176px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{font-family:var(--font-head);font-weight:700;display:block;margin-bottom:2px;font-size:1.05em;}
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;display:flex;gap:8px;}
  .actions.show{visibility:visible;}
  .actions button{
    font-family:var(--font-head);font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);background:var(--psg-blue);
    border:none;border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  .actions button:hover{background:#066890;}
  .actions button:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}
  .actions button[hidden]{display:none;}

  /* ============================================================
     NARROW SCREENS (Trainual mobile app clips near 450px and
     will not scroll). Layout capped at 430px; feedback and its
     button pinned to the TOP so they are always reachable.
     ============================================================ */
  @media (max-width:700px){
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}
    .response{
      position:absolute;top:0;left:0;right:0;
      margin:0;padding:10px;min-height:0;z-index:5;
      background:transparent;pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    .options.images{grid-template-columns:repeat(3,1fr);gap:6px;min-height:118px;}
    .options.texts{gap:6px;}
    .opt{padding:5px;border-width:2px;border-radius:8px;gap:3px;}
    .options.texts .opt{padding:7px 9px;gap:8px;}
    .opt .txt{font-size:14px;line-height:1.3;}
    .opt .letter{font-size:12px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .stage{flex-direction:column;gap:6px;min-height:150px;}
    .diagram{padding:4px;border-width:2px;}
    .opt.hot{border-width:3px;border-radius:6px;}
    .stage.mode-picture .options.letters{flex:0 0 auto;grid-template-columns:repeat(3,1fr);gap:6px;}
    .options.letters .opt{font-size:16px;padding:6px;}
    /* Wide logos: one per row so each stays readable */
    .options.images.stack{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);}
    .options.images.stack .opt{flex-direction:row;padding:4px 8px;gap:8px;}
    .options.images.stack .opt img{flex:1 1 0;min-width:0;width:0;}
    .options.images.stack .opt .label{order:-1;width:52px;text-align:left;}
    .rule{margin-bottom:6px;}
    .prompt{font-size:14.5px;line-height:1.35;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <p class="progress" id="progress"></p>
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
  </div>

  <div class="stage" id="stage">
    <div class="diagram" id="diagram"><div class="hotwrap" id="hotwrap"><img id="diagram-img" alt=""></div></div>
    <div class="options" id="options" role="group" aria-labelledby="q-prompt"></div>
  </div>

  <div class="response" id="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button id="retry" type="button">Try again</button>
      <button id="next" type="button">Next question</button>
      <button id="restart" type="button">Start over</button>
    </div>
  </div>

</div>

<script>
/* ================================================================
   EDIT BELOW THIS LINE TO CHANGE THE ACTIVITY
   ----------------------------------------------------------------
   title      - heading shown on every question
   questions  - one entry per question, shown in order
     type     - "text" (stacked text answers), "image" (photos), or
                "diagram" (one picture with clickable letters on it; set
                src/alt on the question. Each option's "box" is the
                letter's position: [left, top, width, height] in %), or
                "picture" (one picture plus answer buttons; set src/alt
                on the question, and the button wording as each "text")
     stack    - image questions only: true puts wide logos one per row
                on phones so they stay readable
     hint     - optional; replaces the small instruction line
     prompt   - the question itself
     options  - one entry per answer. Set correct:true on the right one.
                text questions: "text" is the answer wording
                image questions: "src" is the picture, "alt" describes it
                verdict  - short bold line shown first
                feedback - the explanation (keep to about two lines)
   ================================================================ */

        const lab = document.createElement("span");
        lab.className = "label"; lab.textContent = o.label;
        b.appendChild(img); b.appendChild(lab);
      } else if (q.type === "picture") {
        b.textContent = o.text;
      } else if (q.type === "diagram") {
        b.classList.add("hot");
        b.setAttribute("aria-label", "Letter " + o.text);
        /* Enlarge the tap area beyond the letter box (in %), kept inside the picture */
        const padX = 4, padY = 2;
        const l = Math.max(0, o.box[0] - padX), t = Math.max(0, o.box[1] - padY);
        const r = Math.min(100, o.box[0] + o.box[2] + padX), btm = Math.min(100, o.box[1] + o.box[3] + padY);
        b.style.left = l + "%"; b.style.top = t + "%";
        b.style.width = (r - l) + "%"; b.style.height = (btm - t) + "%";
        b.addEventListener("click", function () { choose(i); });
        document.getElementById("hotwrap").appendChild(b);
        return b;
      } else {
        const letter = document.createElement("span");
        letter.className = "letter"; letter.textContent = LETTERS[i];
        letter.setAttribute("aria-hidden", "true");
        const txt = document.createElement("span");
        txt.className = "txt"; txt.textContent = o.text;
        b.appendChild(letter); b.appendChild(txt);
      }
      b.addEventListener("click", function () { choose(i); });
      grid.appendChild(b);
      return b;
    });
    reset(false);
  }

  function choose(i) {
    if (grid.dataset.locked === "1") return;
    const q = ACTIVITY.questions[qIndex];
    const opt = q.options[i];
    grid.dataset.locked = "1";

    cards.forEach(function (c, j) {
      c.classList.add("locked");
      if (j === i) c.classList.add(opt.correct ? "chosen-correct" : "chosen-incorrect");
      else c.classList.add("dimmed");
    });

    verdict.textContent = opt.verdict;
    explain.textContent = opt.feedback;
    fb.className = "feedback show " + (opt.correct ? "correct" : "incorrect");

    const last = qIndex === total - 1;
    retryBtn.hidden   = opt.correct;
    nextBtn.hidden    = !opt.correct || last;
    restartBtn.hidden = !opt.correct || !last;
    actions.className = "actions show";
    response.classList.add("active");

    const target = !opt.correct ? retryBtn : (last ? restartBtn : nextBtn);
    target.focus({ preventScroll: true });
  }

  function reset(refocus) {
    grid.dataset.locked = "0";
    cards.forEach(function (c) { c.className = c.classList.contains("hot") ? "opt hot" : "opt"; });
    fb.className = "feedback";
    actions.className = "actions";
    response.classList.remove("active");
    if (refocus === true && cards.length) cards[0].focus({ preventScroll: true });
  }

  retryBtn.addEventListener("click", function () { reset(true); });
  nextBtn.addEventListener("click", function () {
    qIndex = Math.min(qIndex + 1, total - 1);
    render();
    if (cards.length) cards[0].focus({ preventScroll: true });
  });
  restartBtn.addEventListener("click", function () {
    qIndex = 0;
    render();
    if (cards.length) cards[0].focus({ preventScroll: true });
  });

  /* Size the diagram so the hotspots line up with the picture:
     fit the image's natural shape inside the space available. */
  function fitDiagram() {
    const box = document.getElementById("diagram");
    const wrap = document.getElementById("hotwrap");
    const img = document.getElementById("diagram-img");
    if (!img.naturalWidth || box.offsetParent === null) return;
    const cs = getComputedStyle(box);
    const aw = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const r = img.naturalWidth / img.naturalHeight;
    let w = aw, h = aw / r;
    if (h > ah) { h = ah; w = ah * r; }
    w = Math.min(w, img.naturalWidth); h = w / r;
    wrap.style.width = Math.floor(w) + "px";
    wrap.style.height = Math.floor(h) + "px";
  }
  document.getElementById("diagram-img").addEventListener("load", fitDiagram);
  window.addEventListener("resize", fitDiagram);
  const _render = render;
  render = function () { _render(); requestAnimationFrame(fitDiagram); };

  render();
})();
</script>
</body>
</html>
