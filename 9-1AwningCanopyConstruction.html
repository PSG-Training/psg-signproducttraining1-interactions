<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice with Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --psg-blue:#077CAB; --psg-navy:#0C2340; --card-gray:#EAEAEA;
    --page-bg:#F5F5F5; --white:#FFFFFF; --correct:#1F7A3D; --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{background:var(--page-bg);font-family:var(--font-body);color:var(--psg-navy);-webkit-font-smoothing:antialiased;}

  /* Fit-to-height: the photo absorbs leftover space; text and controls are fixed size. */
  .wrap{
    height:100%;max-width:1100px;margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px);
    min-height:0;overflow:auto;position:relative;
  }
  .head{flex:0 0 auto;}
  h1{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(3.2vw,4.4vh),32px);line-height:1.15;margin:0 0 5px;}
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);}
  .count{font-family:var(--font-head);font-weight:600;font-size:clamp(10px,min(1.2vw,1.7vh),13px);letter-spacing:.06em;text-transform:uppercase;color:var(--psg-blue);margin:0 0 2px;}
  .prompt{font-size:clamp(14px,min(2vw,2.7vh),20px);line-height:1.35;margin:0;max-width:70ch;}

  .main{flex:1 1 auto;min-height:0;display:flex;gap:clamp(10px,1.6vw,22px);}
  .stage{
    flex:1 1 auto;min-width:0;min-height:150px;
    display:flex;align-items:center;justify-content:center;
  }
  .stage svg{width:100%;height:100%;display:block;}
  .side{flex:0 0 clamp(230px,30vw,330px);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px);min-height:0;}

  /* Arrows drawn over the photo */
  .arrow{cursor:pointer;}
  .arrow polygon{fill:var(--psg-navy);stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:fill .15s ease;}
  .arrow text{fill:#fff;font-family:var(--font-head);font-weight:700;font-size:20px;dominant-baseline:central;text-anchor:middle;pointer-events:none;}
  .arrow:hover polygon{fill:var(--psg-blue);}
  .arrow.static{cursor:default;}
  .arrow.static:hover polygon{fill:var(--psg-navy);}
  .arrow.is-correct polygon{fill:var(--correct);}
  .arrow.is-incorrect polygon{fill:var(--incorrect);}
  .arrow.dimmed{opacity:.4;}
  .locked .arrow{cursor:default;}

  .options{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);}
  .opt{
    min-height:40px;background:var(--white);border:3px solid var(--card-gray);border-radius:8px;
    padding:clamp(6px,1.1vh,11px) 12px;cursor:pointer;text-align:left;
    font-family:var(--font-head);font-weight:600;font-size:clamp(13px,min(1.5vw,2.1vh),16px);color:var(--psg-navy);
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* Feedback slot is reserved before answering (visibility, not display) so nothing reflows. */
  .response{flex:1 1 auto;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);min-height:clamp(110px,22vh,190px);}
  .feedback{
    visibility:hidden;border-left:6px solid var(--psg-blue);background:var(--card-gray);border-radius:6px;
    padding:clamp(8px,1.4vh,14px) clamp(10px,1.4vw,16px);font-size:clamp(13px,min(1.6vw,2.3vh),17px);line-height:1.4;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{font-family:var(--font-head);font-weight:700;display:block;margin-bottom:2px;font-size:1.05em;}
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}
  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  button.act{
    font-family:var(--font-head);font-weight:600;font-size:clamp(13px,min(1.5vw,2vh),15px);color:var(--white);
    background:var(--psg-blue);border:none;border-radius:6px;padding:clamp(8px,1.2vh,11px) clamp(14px,1.8vw,22px);cursor:pointer;
  }
  button.act:hover{background:#066890;}
  button.act:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  /* Completion screen */
  .done{display:none;flex:0 0 auto;}
  .wrap.finished .head,.wrap.finished .main{display:none;}
  .wrap.finished .done{display:block;}
  .done-card{background:var(--white);border:3px solid var(--card-gray);border-left:6px solid var(--correct);border-radius:10px;padding:clamp(14px,2.4vh,26px) clamp(14px,2vw,26px);max-width:620px;}
  .done-card h2{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(2.6vw,3.6vh),26px);margin:0 0 6px;color:var(--correct);}
  .done-card p{font-size:clamp(14px,min(1.8vw,2.5vh),18px);line-height:1.4;margin:0 0 clamp(10px,1.8vh,18px);}

  /* ============ NARROW SCREENS (phones, Trainual mobile app) ============ */
  @media (max-width:700px){
    .wrap{padding:10px;gap:7px;max-height:430px;}
    .rule{margin-bottom:5px;}
    .main{flex-direction:column;gap:7px;}
    .stage{min-height:110px;}
    .stage svg{height:auto;max-height:100%;}
    .side{flex:0 0 auto;}
    .options{flex-direction:row;gap:6px;}
    .opt{flex:1 1 0;text-align:center;padding:6px 4px;border-width:2px;font-size:13px;}
    /* Feedback pinned to the TOP: the app clips the frame and will not scroll. */
    .response{position:absolute;top:0;left:0;right:0;margin:0;padding:10px;min-height:0;z-index:5;background:transparent;pointer-events:none;}
    .response.active{background:var(--page-bg);pointer-events:auto;box-shadow:0 6px 16px rgba(12,35,64,.14);border-radius:0 0 10px 10px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }
</style>
</head>

  3: { x: 404, y: 226, angle: 35 }
};

const QUESTIONS = [
  {
    type: "arrow",
    prompt: "Select the arrow that points to a rib.",
    correct: 1,
    verdicts: { right: "Nice work.", wrong: "Not quite." },
    feedback: {
      1: "Ribs are the vertical sections of the frame. They define the shape of the awning or canopy.",
      2: "That is the light strip. Older awnings held fluorescent bulbs here; new awnings use LEDs. Ribs are the curved, vertical tubes that shape the frame.",
      3: "That is a rail. Rails run horizontally and connect the ribs. Ribs are the vertical sections that define the shape."
    }
  },
  {
    type: "arrow",
    prompt: "Select the arrow that points to a rail.",
    correct: 3,
    verdicts: { right: "That's it.", wrong: "Not this one." },
    feedback: {
      1: "That is a rib, a vertical section that defines the shape. Rails run horizontally and tie the ribs together.",
      2: "That is the light strip. Older awnings held fluorescent bulbs here; new awnings use LEDs. Rails are the horizontal tubes that connect the ribs.",
      3: "Rails are the horizontal sections of the frame. They connect the rib sections at specified intervals."
    }
  },
  {
    type: "text",
    prompt: "Ribs and rails are both parts of which component?",
    show: { 1: "Rib", 3: "Rail" },
    verdicts: { right: "Exactly.", wrong: "Try again." },
    options: [
      { label: "Frame", correct: true,
        feedback: "The frame is the skeleton, usually square aluminum or steel tube. Ribs and rails are its vertical and horizontal sections." },
      { label: "Cover", correct: false,
        feedback: "The cover is the fabric stretched over the frame. Ribs and rails are the tubes underneath it." },
      { label: "Back", correct: false,
        feedback: "A back attaches to the open back of the frame, and only lit awnings need one. Ribs and rails make up the frame itself." }
    ]
  }
];
/* ================================================================
   NO EDITS NEEDED BELOW THIS LINE
   ================================================================ */

(function () {
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = function (id) { return document.getElementById(id); };
  const wrap = $("wrap"), arrowLayer = $("arrows"), optBox = $("options");
  const fb = $("feedback"), verdict = $("verdict"), explain = $("explain");
  const actions = $("actions"), actBtn = $("act"), response = $("response");

  let qi = 0, locked = false, firstTry = true, score = 0, lastCorrect = false;
  let cards = [], arrowEls = {};

  $("title").textContent = ACTIVITY.title;
  document.title = ACTIVITY.title;

  // Arrow shape: tip at 0,0, tail running to +x. Scaled up for legibility.
  const SHAPE = "0,0 40,-30 40,-14 125,-14 125,14 40,14 40,30";

  function makeArrow(n, text, clickable) {
    const a = ARROWS[n];
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "arrow" + (clickable ? "" : " static"));
    g.setAttribute("transform", "translate(" + a.x + "," + a.y + ") rotate(" + a.angle + ")");
    g.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(SVGNS, "polygon");
    p.setAttribute("points", SHAPE);
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("x", "84"); t.setAttribute("y", "0");
    t.textContent = text;
    g.appendChild(p); g.appendChild(t);
    if (clickable) g.addEventListener("click", function () { choose(n); });
    arrowLayer.appendChild(g);
    return g;
  }

  function render() {
    const q = QUESTIONS[qi];
    locked = false; firstTry = true;
    $("count").textContent = "Question " + (qi + 1) + " of " + QUESTIONS.length;
    $("prompt").textContent = q.prompt;
    arrowLayer.innerHTML = ""; optBox.innerHTML = ""; arrowEls = {}; cards = [];
    $("stage").classList.remove("locked");

    if (q.type === "arrow") {
      Object.keys(ARROWS).forEach(function (n) { arrowEls[n] = makeArrow(n, n, true); });
      Object.keys(ARROWS).forEach(function (n) { cards.push(addCard("Option " + n, n)); });
    } else {
      Object.keys(q.show || {}).forEach(function (n) { makeArrow(n, q.show[n], false); });
      q.options.forEach(function (o, i) { cards.push(addCard(o.label, i)); });
    }
    clearFeedback();
  }

  function addCard(label, key) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.textContent = label;
    b.dataset.key = key;
    b.addEventListener("click", function () { choose(key); });
    optBox.appendChild(b);
    return b;
  }

  function choose(key) {
    if (locked) return;
    locked = true;
    const q = QUESTIONS[qi];
    let right, text;
    if (q.type === "arrow") {
      right = String(key) === String(q.correct);
      text = q.feedback[key];
      Object.keys(arrowEls).forEach(function (n) {
        const el = arrowEls[n];
        if (n === String(key)) el.classList.add(right ? "is-correct" : "is-incorrect");
        else el.classList.add("dimmed");
      });
    } else {
      const o = q.options[key];
      right = !!o.correct; text = o.feedback;
    }
    $("stage").classList.add("locked");
    cards.forEach(function (c) {
      c.classList.add("locked");
      if (c.dataset.key === String(key)) c.classList.add(right ? "chosen-correct" : "chosen-incorrect");
      else c.classList.add("dimmed");
    });

    if (right && firstTry) score++;
    if (!right) firstTry = false;
    lastCorrect = right;

    verdict.textContent = right ? q.verdicts.right : q.verdicts.wrong;
    explain.textContent = text;
    fb.className = "feedback show " + (right ? "correct" : "incorrect");
    actBtn.textContent = right ? (qi === QUESTIONS.length - 1 ? ACTIVITY.finishLabel : ACTIVITY.nextLabel) : ACTIVITY.retryLabel;
    actions.className = "actions show";
    response.classList.add("active");
    actBtn.focus({ preventScroll: true });
  }

  function clearFeedback() {
    fb.className = "feedback"; actions.className = "actions";
    response.classList.remove("active");
  }

  function retry() {
    locked = false;
    $("stage").classList.remove("locked");
    cards.forEach(function (c) { c.className = "opt"; });
    Object.keys(arrowEls).forEach(function (n) { arrowEls[n].setAttribute("class", "arrow"); });
    clearFeedback();
    if (cards[0]) cards[0].focus({ preventScroll: true });
  }

  actBtn.addEventListener("click", function () {
    if (!lastCorrect) { retry(); return; }
    if (qi < QUESTIONS.length - 1) { qi++; render(); if (cards[0]) cards[0].focus({ preventScroll: true }); return; }
    finish();
  });

  function finish() {
    wrap.classList.add("finished");
    $("done-title").textContent = ACTIVITY.doneTitle;
    $("done-text").textContent = ACTIVITY.doneText.replace("{score}", score).replace("{total}", QUESTIONS.length);
    $("restart").focus({ preventScroll: true });
  }

  $("restart").addEventListener("click", function () {
    wrap.classList.remove("finished");
    qi = 0; score = 0; render();
    if (cards[0]) cards[0].focus({ preventScroll: true });
  });

  render();
})();
</script>
</body>
