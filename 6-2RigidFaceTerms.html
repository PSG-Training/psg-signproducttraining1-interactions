<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice with Terms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     The page fills exactly the height it is given and never more.
     Text and the button are fixed size; the image row absorbs
     whatever space is left over. In a short box the images
     shrink instead of the button falling off the bottom.
     ============================================================ */
  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only; normally nothing scrolls */
  }

  /* ---------- header block: fixed size ---------- */
  .head{flex:0 0 auto;}
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{
    height:4px;background:var(--psg-blue);
    width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);
  }
  .prompt{
    font-size:clamp(14px,min(2vw,2.7vh),20px);
    line-height:1.4;
    margin:0 0 3px;
    max-width:70ch;
  }
  .hint{
    font-size:clamp(11px,min(1.4vw,1.9vh),14px);
    color:#5A6B7D;
    margin:0;
  }

  /* ---------- option row: absorbs leftover space ---------- */
  .options{
    flex:1 1 auto;
    /* Hard floor: the row may shrink, but never below this. If the
       frame is too short to honour it, .wrap scrolls instead. */
    min-height:150px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:clamp(8px,1.4vw,18px);
    align-content:stretch;
  }
  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){
    border-color:var(--psg-blue);
    box-shadow:0 4px 14px rgba(12,35,64,.12);
  }
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .opt .label{
    flex:0 0 auto;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);
    color:#5A6B7D;
  }

  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* ---------- response block: fixed size, always reserved ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(96px,20vh,168px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{
    font-family:var(--font-head);
    font-weight:700;
    display:block;
    margin-bottom:2px;
    font-size:1.05em;
  }
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  button.retry{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  button.retry:hover{background:#066890;}
  button.retry:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  /* ============================================================
     NARROW SCREENS (phones, Trainual mobile app)
     Three across instead of stacked. Roughly a third of the
     height, so everything still fits in a short frame.
     ============================================================ */
  @media (max-width:700px){
    /* The Trainual mobile app clips the frame near 450px. Cap our own
       layout below that so content is never laid out into space the
       learner will not be shown. Any extra frame height is left empty
       and clipped harmlessly. */
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}

    /* The Trainual mobile app clips the frame and will not scroll
       inside it. So feedback is pinned to the TOP, where it is
       always visible, instead of sitting below the images. */
    .response{
      position:absolute;
      top:0;left:0;right:0;
      margin:0;
      padding:10px;
      min-height:0;
      z-index:5;
      background:transparent;
      pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);
      pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    .options{
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      min-height:118px;
    }
    .opt{padding:5px;border-width:2px;border-radius:8px;gap:3px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .rule{margin-bottom:6px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }

  /* ---------- progress line ---------- */
  .progress{font-family:var(--font-head);font-weight:600;font-size:clamp(11px,min(1.3vw,1.8vh),13px);
    color:var(--psg-blue);letter-spacing:.05em;text-transform:uppercase;margin:0 0 3px;}

  /* ---------- text-answer questions (one stem photo + word choices) ---------- */
  .stem{flex:1 1 auto;min-height:150px;display:flex;justify-content:center;}
  .stem img{max-width:100%;height:100%;min-height:0;object-fit:contain;border-radius:8px;
    border:3px solid var(--card-gray);background:var(--white);}
  .stem[hidden]{display:none;}
  .options.text{flex:0 0 auto;min-height:0;grid-template-columns:repeat(4,1fr);}
  .options.text .opt{padding:clamp(8px,1.4vh,14px) 8px;min-height:44px;justify-content:center;}
  .options.text .opt .word{font-family:var(--font-head);font-weight:600;
    font-size:clamp(14px,min(1.8vw,2.4vh),18px);color:var(--psg-navy);}

  /* ---------- finish screen ---------- */
  .done{flex:1 1 auto;display:none;}
  .done.show{display:block;}
  .done p{font-size:clamp(14px,min(2vw,2.7vh),20px);line-height:1.4;margin:0 0 12px;max-width:65ch;}
  button.next{font-family:var(--font-head);font-weight:600;font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);background:var(--psg-blue);border:none;border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);cursor:pointer;}
  button.next:hover{background:#066890;}
  button.next:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}
  button[hidden],.options[hidden],.hint[hidden]{display:none !important;}

  @media (max-width:700px){
    .stem{min-height:80px;max-height:150px;}
    .options.text{grid-template-columns:repeat(2,1fr);gap:6px;}
    .options.text .opt{padding:7px 4px;}
    .options.text .opt .word{font-size:14px;}
    .progress{font-size:10px;margin-bottom:2px;}
  }

  /* ---------- diagram questions ---------- */
  .stage-area{flex:1 1 auto;min-height:150px;position:relative;display:flex;justify-content:center;align-items:flex-start;}
  .stage-area[hidden]{display:none !important;}
  .stage{position:relative;background:var(--white);border:3px solid var(--card-gray);border-radius:10px;overflow:visible;}
  .stage img{display:block;width:100%;height:100%;border-radius:7px;}
  button.marker{position:absolute;display:flex;align-items:center;justify-content:center;
    min-width:34px;min-height:22px;padding:0;border:2px solid var(--white);border-radius:5px;
    background:var(--psg-blue);color:var(--white);font-family:var(--font-head);font-weight:700;
    font-size:var(--mk-font,14px);cursor:pointer;box-shadow:0 2px 6px rgba(12,35,64,.25);
    transition:background .15s ease, transform .15s ease;}
  button.marker::before{content:"";position:absolute;inset:-6px;}
  button.marker:hover:not(.locked){background:var(--psg-navy);}
  button.marker:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}
  button.marker.chosen-correct{background:var(--correct);}
  button.marker.chosen-incorrect{background:var(--incorrect);}
  button.marker.dimmed{opacity:.55;}
  button.marker.locked{cursor:default;}
  @media (max-width:700px){ .stage-area{min-height:120px;} .stage{border-width:2px;border-radius:8px;} }

  .options.text.three{grid-template-columns:repeat(3,1fr);}
  .options.text.three .opt .word{font-size:clamp(13px,min(1.7vw,2.3vh),17px);text-align:center;line-height:1.2;}
  @media (max-width:700px){ .options.text.three{grid-template-columns:1fr;gap:5px;} .options.text.three .opt{min-height:40px;padding:6px;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <p class="progress" id="progress"></p>
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="hint"></p>
  </div>

  <div class="stage-area" id="stage-area" hidden>
    <div class="stage" id="stage"><img id="stage-img" alt=""></div>
  </div>

  <div class="options text" id="options" role="group" aria-labelledby="q-prompt"></div>

  <div class="done" id="done">
    <p id="done-text"></p>
    <button class="next" id="restart" type="button">Start over</button>
  </div>

  <div class="response" id="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button class="retry" id="retry" type="button">Try again</button>
      <button class="next" id="next" type="button" hidden>Next</button>
    </div>
  </div>

</div>

<script>
/* ================================================================
   EDIT BELOW THIS LINE TO CHANGE THE QUESTIONS
   ----------------------------------------------------------------
   Each QUESTION has one or more PARTS, shown one after another.

   Diagram questions:
     image    - the diagram (labels already removed)
     markers  - numbered boxes placed where the labels were.
                box: [left %, top %, width %, height %] of the image.
                feedback: shown when that box is picked (wrong pick).
     parts    - each part asks for one marker: answer = marker number.
                correct = feedback shown when they get it right.

   Word-answer questions:
     parts    - prompt, options (text, correct, feedback)

   Keep feedback to about two lines.
   ================================================================ */

(function () {
  const $ = function (id) { return document.getElementById(id); };
  const grid = $("options"), area = $("stage-area"), stage = $("stage"), stageImg = $("stage-img");
  const fb = $("feedback"), verdictEl = $("verdict"), explain = $("explain");
  const actions = $("actions"), response = $("response"), retryBtn = $("retry"), nextBtn = $("next");
  const done = $("done"), hint = $("hint");
  let q = 0, p = 0, buttons = [], locked = false;

  $("q-title").textContent = TITLE; document.title = TITLE;
  $("done-text").textContent = FINISH;

  /* Size the diagram to fit its area while keeping its shape,
     so the % positions of the boxes always line up. */
  function fitStage() {
    const Q = QUESTIONS[q];
    if (!Q || Q.type !== "diagram" || area.hidden) return;
    const iw = stageImg.naturalWidth, ih = stageImg.naturalHeight;
    if (!iw || !ih) return;
    const aw = area.clientWidth, ah = area.clientHeight;
    const border = 6;
    let w = aw - border, h = w * ih / iw;
    if (h > ah - border) { h = ah - border; w = h * iw / ih; }
    stage.style.width = Math.max(w, 40) + "px";
    stage.style.height = Math.max(h, 30) + "px";
    stage.style.setProperty("--mk-font", Math.max(12, Math.min(18, w * 0.03)) + "px");
  }
  window.addEventListener("resize", fitStage);
  stageImg.addEventListener("load", fitStage);

  function totalParts() { return QUESTIONS.reduce(function (s, x) { return s + x.parts.length; }, 0); }
  function stepNumber() { let s = 0; for (let i = 0; i < q; i++) s += QUESTIONS[i].parts.length; return s + p + 1; }

  function render() {
    const Q = QUESTIONS[q], P = Q.parts[p];
    $("progress").textContent = "Question " + (q + 1) + " of " + QUESTIONS.length +
      (Q.parts.length > 1 ? "  \u00b7  Part " + (p + 1) + " of " + Q.parts.length : "");
    $("q-prompt").textContent = P.prompt;
    hint.hidden = false; done.className = "done";
    locked = false;

    if (Q.type === "diagram") {
      hint.textContent = "Click a numbered box to check your answer.";
      grid.hidden = true; grid.innerHTML = "";
      area.hidden = false;
      if (stageImg.getAttribute("src") !== Q.image) { stageImg.src = Q.image; stageImg.alt = Q.alt; }
      stage.querySelectorAll("button.marker").forEach(function (b) { b.remove(); });
      buttons = Q.markers.map(function (m) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "marker"; b.dataset.option = m.n;
        b.textContent = m.n;
        b.setAttribute("aria-label", "Option " + m.n);
        b.style.left = m.box[0] + "%"; b.style.top = m.box[1] + "%";
        b.style.width = m.box[2] + "%"; b.style.height = m.box[3] + "%";
        b.addEventListener("click", function () { chooseMarker(m); });
        stage.appendChild(b);
        return b;
      });
      fitStage();
    } else {
      hint.textContent = "Select an answer to check it.";
      area.hidden = true;
      grid.hidden = false; grid.innerHTML = ""; grid.className = "options text three";
      buttons = P.options.map(function (o) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.dataset.option = o.text;
        const w = document.createElement("span"); w.className = "word"; w.textContent = o.text;
        b.appendChild(w);
        b.addEventListener("click", function () { chooseText(o, b); });
        grid.appendChild(b);
        return b;
      });
    }
    clearFeedback();
  }

  function lockAll(picked, ok) {
    locked = true;
    buttons.forEach(function (b) {
      b.classList.add("locked");
      if (b === picked) b.classList.add(ok ? "chosen-correct" : "chosen-incorrect");
      else b.classList.add("dimmed");
    });
  }

  function show(ok, verdictText, text) {
    verdictEl.textContent = verdictText;
    explain.textContent = text;
    fb.className = "feedback show " + (ok ? "correct" : "incorrect");
    retryBtn.hidden = ok; nextBtn.hidden = !ok;
    const last = (q === QUESTIONS.length - 1 && p === QUESTIONS[q].parts.length - 1);
    nextBtn.textContent = last ? "Finish" : "Next";
    actions.className = "actions show";
    response.classList.add("active");
    (ok ? nextBtn : retryBtn).focus({ preventScroll: true });
  }

  const WRONG = ["Not quite.", "Close, but no.", "Look again.", "Not this one."];

  function chooseMarker(m) {
    if (locked) return;
    const Q = QUESTIONS[q], P = Q.parts[p], ok = (m.n === P.answer);
    lockAll(buttons[Q.markers.indexOf(m)], ok);
    show(ok, ok ? P.verdict : WRONG[(stepNumber() - 1) % WRONG.length], ok ? P.correct : m.feedback);
  }

  function chooseText(o, b) {
    if (locked) return;
    const P = QUESTIONS[q].parts[p];
    lockAll(b, o.correct);
    show(o.correct, o.correct ? P.verdict : WRONG[(stepNumber() - 1) % WRONG.length], o.feedback);
  }

  function clearFeedback() {
    fb.className = "feedback"; actions.className = "actions";
    retryBtn.hidden = false; nextBtn.hidden = true;
    response.classList.remove("active");
  }

  function retry() {
    locked = false;
    buttons.forEach(function (b) { b.className = b.classList.contains("marker") ? "marker" : "opt"; });
    clearFeedback();
    if (buttons[0]) buttons[0].focus({ preventScroll: true });
  }

  function next() {
    if (p < QUESTIONS[q].parts.length - 1) { p++; render(); }
    else if (q < QUESTIONS.length - 1) { q++; p = 0; render(); }
    else finish();
  }

  function finish() {
    clearFeedback();
    $("progress").textContent = "Practice complete";
    $("q-prompt").textContent = "";
    hint.hidden = true; area.hidden = true; grid.hidden = true;
    done.className = "done show";
    $("restart").focus({ preventScroll: true });
  }

  retryBtn.addEventListener("click", retry);
  nextBtn.addEventListener("click", next);
  $("restart").addEventListener("click", function () { q = 0; p = 0; render(); });
  render();
})();
</script>
