<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice with Frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     ============================================================ */
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only */
  }

  /* ---------- header ---------- */
  .head{flex:0 0 auto;}
  .progress{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(10px,min(1.3vw,1.8vh),13px);
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--psg-blue);
    margin:0 0 3px;
  }
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(17px,min(3.2vw,4.4vh),32px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);}
  .prompt{font-size:clamp(14px,min(2vw,2.7vh),20px);line-height:1.4;margin:0 0 3px;max-width:75ch;}
  .hint{font-size:clamp(11px,min(1.4vw,1.9vh),14px);color:#5A6B7D;margin:0;}

  /* ---------- options ---------- */
  .options{
    display:grid;
    gap:clamp(8px,1.4vw,18px);
  }
  /* Image questions: the row absorbs leftover height, with a floor */
  .options.images{
    flex:1 1 auto;
    min-height:150px;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    align-content:stretch;
  }
  /* Text questions: stacked, natural height */
  .options.texts{
    flex:0 0 auto;
    grid-template-columns:1fr;
    max-width:780px;
    gap:clamp(6px,1.1vh,12px);
  }
  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{flex:1 1 auto;min-height:0;width:100%;height:100%;object-fit:contain;display:block;}
  .opt .label{
    flex:0 0 auto;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);color:#5A6B7D;
  }
  .options.texts .opt{
    flex-direction:row;
    align-items:center;
    text-align:left;
    gap:10px;
    padding:clamp(8px,1.4vh,14px) clamp(10px,1.4vw,16px);
  }
  .opt .letter{
    flex:0 0 auto;
    font-family:var(--font-head);font-weight:700;
    font-size:clamp(12px,min(1.5vw,2vh),15px);
    color:var(--white);background:var(--psg-blue);
    width:1.9em;height:1.9em;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .opt .txt{font-size:clamp(14px,min(1.9vw,2.5vh),18px);line-height:1.35;}

  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* ---------- response: reserved space, never reflows ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(110px,22vh,176px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{font-family:var(--font-head);font-weight:700;display:block;margin-bottom:2px;font-size:1.05em;}
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;display:flex;gap:8px;}
  .actions.show{visibility:visible;}
  .actions button{
    font-family:var(--font-head);font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);background:var(--psg-blue);
    border:none;border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  .actions button:hover{background:#066890;}
  .actions button:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}
  .actions button[hidden]{display:none;}

  /* ============================================================
     NARROW SCREENS (Trainual mobile app clips near 450px and
     will not scroll). Layout capped at 430px; feedback and its
     button pinned to the TOP so they are always reachable.
     ============================================================ */
  @media (max-width:700px){
    .wrap{padding:10px 10px;gap:8px;position:relative;max-height:430px;}
    .response{
      position:absolute;top:0;left:0;right:0;
      margin:0;padding:10px;min-height:0;z-index:5;
      background:transparent;pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    .options.images{grid-template-columns:repeat(3,1fr);gap:6px;min-height:118px;}
    .options.texts{gap:6px;}
    .opt{padding:5px;border-width:2px;border-radius:8px;gap:3px;}
    .options.texts .opt{padding:7px 9px;gap:8px;}
    .opt .txt{font-size:14px;line-height:1.3;}
    .opt .letter{font-size:12px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .rule{margin-bottom:6px;}
    .prompt{font-size:14.5px;line-height:1.35;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <p class="progress" id="progress"></p>
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
  </div>

  <div class="options" id="options" role="group" aria-labelledby="q-prompt"></div>

  <div class="response" id="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button id="retry" type="button">Try again</button>
      <button id="next" type="button">Next question</button>
      <button id="restart" type="button">Start over</button>
    </div>
  </div>

</div>

     prompt   - the question itself

                text questions: "text" is the answer wording
                image questions: "src" is the picture, "alt" describes it
                verdict  - short bold line shown first
                feedback - the explanation (keep to about two lines)

   ================================================================ */

(function () {
  const grid     = document.getElementById("options");
  const response = document.getElementById("response");
  const fb       = document.getElementById("feedback");
  const verdict  = document.getElementById("verdict");
  const explain  = document.getElementById("explain");
  const actions  = document.getElementById("actions");
  const retryBtn = document.getElementById("retry");
  const nextBtn  = document.getElementById("next");
  const restartBtn = document.getElementById("restart");
  const total = ACTIVITY.questions.length;
  const LETTERS = "ABCDEF";
  let qIndex = 0;
  let cards = [];

  document.getElementById("q-title").textContent = ACTIVITY.title;
  document.title = ACTIVITY.title;

  function render() {
    const q = ACTIVITY.questions[qIndex];
    document.getElementById("progress").textContent = "Question " + (qIndex + 1) + " of " + total;
    document.getElementById("q-prompt").textContent = q.prompt;
    document.getElementById("q-hint").textContent =
      q.type === "image" ? "Select an image to check your answer." : "Select an answer to check it.";

    grid.innerHTML = "";
    grid.className = "options " + (q.type === "image" ? "images" : "texts");

    cards = q.options.map(function (o, i) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      if (q.type === "image") {
        b.setAttribute("aria-label", o.label + ": " + o.alt);
        const img = document.createElement("img");
        img.src = o.src; img.alt = o.alt;
        const lab = document.createElement("span");
        lab.className = "label"; lab.textContent = o.label;
        b.appendChild(img); b.appendChild(lab);
      } else {
        const letter = document.createElement("span");
        letter.className = "letter"; letter.textContent = LETTERS[i];
        letter.setAttribute("aria-hidden", "true");
        const txt = document.createElement("span");
        txt.className = "txt"; txt.textContent = o.text;
        b.appendChild(letter); b.appendChild(txt);
      }
      b.addEventListener("click", function () { choose(i); });
      grid.appendChild(b);
      return b;
    });
    reset(false);
  }

  function choose(i) {
    if (grid.dataset.locked === "1") return;
    const q = ACTIVITY.questions[qIndex];
    const opt = q.options[i];
    grid.dataset.locked = "1";

    cards.forEach(function (c, j) {
      c.classList.add("locked");
      if (j === i) c.classList.add(opt.correct ? "chosen-correct" : "chosen-incorrect");
      else c.classList.add("dimmed");
    });

    verdict.textContent = opt.verdict;
    explain.textContent = opt.feedback;
    fb.className = "feedback show " + (opt.correct ? "correct" : "incorrect");

    const last = qIndex === total - 1;
    retryBtn.hidden   = opt.correct;
    nextBtn.hidden    = !opt.correct || last;
    restartBtn.hidden = !opt.correct || !last;
    actions.className = "actions show";
    response.classList.add("active");

    const target = !opt.correct ? retryBtn : (last ? restartBtn : nextBtn);
    target.focus({ preventScroll: true });
  }

  function reset(refocus) {
    grid.dataset.locked = "0";
    cards.forEach(function (c) { c.className = "opt"; });
    fb.className = "feedback";
    actions.className = "actions";
    response.classList.remove("active");
    if (refocus === true && cards.length) cards[0].focus({ preventScroll: true });
  }

  retryBtn.addEventListener("click", function () { reset(true); });
  nextBtn.addEventListener("click", function () {
    qIndex = Math.min(qIndex + 1, total - 1);
    render();
    if (cards.length) cards[0].focus({ preventScroll: true });
  });
  restartBtn.addEventListener("click", function () {
    qIndex = 0;
    render();
    if (cards.length) cards[0].focus({ preventScroll: true });
  });

  render();
})();
</script>
