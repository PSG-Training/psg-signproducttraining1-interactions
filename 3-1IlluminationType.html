<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Types of Illumination &mdash; Knowledge Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PSG BRAND TOKENS
     ============================================================ */
  :root{
    --psg-blue:#077CAB;
    --psg-navy:#0C2340;
    --card-gray:#EAEAEA;
    --page-bg:#F5F5F5;
    --white:#FFFFFF;
    --correct:#1F7A3D;
    --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  /* ============================================================
     FIT-TO-HEIGHT LAYOUT
     The page fills exactly the height it is given and never more.
     Header, options and response are fixed; the stage (images)
     absorbs whatever space is left over.
     ============================================================ */
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    background:var(--page-bg);
    font-family:var(--font-body);
    color:var(--psg-navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    height:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:0;
    overflow:auto;   /* safety net only; normally nothing scrolls */
  }

  /* ---------- header block: fixed size ---------- */
  .head{flex:0 0 auto;}
  .steps{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 0 6px;
    font-family:var(--font-head);
    font-size:clamp(10px,min(1.2vw,1.6vh),12px);
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#5A6B7D;
  }
  .steps .dots{display:flex;gap:5px;}
  .steps .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--card-gray);
    border:1px solid #CFD4D9;
  }
  .steps .dot.done{background:var(--correct);border-color:var(--correct);}
  .steps .dot.here{background:var(--psg-blue);border-color:var(--psg-blue);}
  h1{
    font-family:var(--font-head);
    font-weight:700;
    color:var(--psg-navy);
    font-size:clamp(16px,min(3vw,4.2vh),30px);
    line-height:1.15;
    margin:0 0 5px;
  }
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.4vh,14px);}
  .prompt{
    font-size:clamp(13px,min(1.9vw,2.6vh),20px);
    line-height:1.35;
    margin:0 0 3px;
    max-width:70ch;
  }
  .hint{font-size:clamp(10px,min(1.4vw,1.9vh),14px);color:#5A6B7D;margin:0;}

  /* ---------- stage: the flexible region ---------- */
  /* Used for the image-choice grid (Q1) and for the single stem
     photo (Q3). Always floored so it cannot collapse to a sliver. */
  .stage{
    flex:1 1 auto;
    min-height:150px;
    display:grid;
    gap:clamp(8px,1.4vw,18px);
    align-content:stretch;
  }
  .stage.grid3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .stage.single{grid-template-columns:1fr;min-height:110px;}
  .stage.hidden{display:none;}

  .opt{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(6px,1.2vh,14px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:0;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--psg-navy);
    text-align:center;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt img{flex:1 1 auto;min-height:0;width:100%;height:100%;object-fit:contain;display:block;}
  .opt .label{
    flex:0 0 auto;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:clamp(10px,min(1.2vw,1.7vh),13px);
    color:#5A6B7D;
  }
  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  /* the stem photo on Q3 is not clickable */
  .stem{
    background:var(--white);
    border:3px solid var(--card-gray);
    border-radius:10px;
    padding:clamp(5px,1vh,10px);
    display:flex;align-items:center;justify-content:center;
    min-height:0;overflow:hidden;
  }
  .stem img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;}

  /* ---------- text options: fixed size, sit under the stage ---------- */
  .choices{
    flex:0 0 auto;
    display:grid;
    gap:clamp(6px,1.1vh,10px);
    grid-template-columns:1fr;
  }
  .choices.cols3{grid-template-columns:repeat(3,1fr);}
  .choices.hidden{display:none;}
  .choices .opt{
    flex-direction:row;
    justify-content:flex-start;
    text-align:left;
    padding:clamp(7px,1.2vh,13px) clamp(10px,1.4vw,16px);
    font-size:clamp(12px,min(1.6vw,2.1vh),17px);
    line-height:1.3;
    font-weight:600;
    min-height:0;
  }
  .choices.cols3 .opt{justify-content:center;text-align:center;}

  /* ---------- response block: fixed size, always reserved ---------- */
  .response{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.2vh,14px);
    min-height:clamp(96px,20vh,168px);
  }
  .feedback{
    visibility:hidden;
    border-left:6px solid var(--psg-blue);
    background:var(--card-gray);
    border-radius:6px;
    padding:clamp(8px,1.4vh,16px) clamp(10px,1.4vw,18px);
    font-size:clamp(13px,min(1.8vw,2.4vh),18px);
    line-height:1.45;
  }
  .feedback.show{visibility:visible;}
  .feedback .verdict{
    font-family:var(--font-head);
    font-weight:700;
    display:block;
    margin-bottom:2px;
    font-size:1.05em;
  }
  .feedback.correct{border-left-color:var(--correct);}
  .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);}
  .feedback.incorrect .verdict{color:var(--incorrect);}

  .actions{visibility:hidden;flex:0 0 auto;display:flex;gap:8px;}
  .actions.show{visibility:visible;}
  button.act{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);
    background:var(--psg-blue);
    border:none;
    border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);
    cursor:pointer;
  }
  button.act:hover{background:#066890;}
  button.act:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}
  button.act.hidden{display:none;}

  /* ============================================================
     NARROW SCREENS (phones, Trainual mobile app)
     ============================================================ */
  @media (max-width:700px){
    /* The Trainual mobile app clips the frame near 450px. Cap our own
       layout below that so content is never laid out into space the
       learner will not be shown. */
    .wrap{padding:10px 10px;gap:7px;position:relative;max-height:430px;}

    /* Feedback pinned to the TOP, where it is always visible, instead
       of sitting below content that can grow. */
    .response{
      position:absolute;
      top:0;left:0;right:0;
      margin:0;padding:10px;
      min-height:0;z-index:5;
      background:transparent;pointer-events:none;
    }
    .response.active{
      background:var(--page-bg);
      pointer-events:auto;
      box-shadow:0 6px 16px rgba(12,35,64,.14);
      border-radius:0 0 10px 10px;
    }
    .stage.grid3{grid-template-columns:repeat(3,1fr);gap:6px;min-height:112px;}
    /* The stem photo must not push the text options below the clip
       point. Capped here so the options land around 250px, not 390px. */
    .stage.single{min-height:80px;max-height:150px;}
    .opt{padding:5px;border-width:2px;border-radius:8px;gap:3px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .choices{gap:5px;}
    .choices .opt{padding:7px 9px;font-size:12px;line-height:1.25;}
    .choices.cols3 .opt{padding:7px 4px;font-size:11px;}
    .rule{margin-bottom:5px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
    h1{font-size:16px;}
    .prompt{font-size:13px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="steps">
      <span id="step-label">Question 1 of 3</span>
      <span class="dots" id="step-dots"></span>
    </div>
    <h1 id="q-title"></h1>
    <div class="rule"></div>
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
  </div>

  <div class="stage" id="stage" role="group" aria-labelledby="q-prompt"></div>
  <div class="choices" id="choices" role="group" aria-labelledby="q-prompt"></div>

  <div class="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span>
      <span id="explain"></span>
    </div>
    <div class="actions" id="actions">
      <button class="act hidden" id="retry" type="button">Try again</button>
      <button class="act hidden" id="next" type="button">Next question</button>
      <button class="act hidden" id="restart" type="button">Start over</button>
    </div>
  </div>

</div>

      alt: "A lit Lexington Inn and Suites sign at night with dark gaps across the face"
    },
    options: [
      {
        label: "Hot spots",
        correct: false,
        feedback: "Hot spots are the opposite problem. That is when no diffusers are installed and the lamps show through as bright spots."
      },
      {
        label: "\u201cSwiss cheese\u201d",
        correct: true,
        feedback: "Correct. A lamp has gone out, or the diffusers have holes too large, leaving dark gaps across the face."
      },
      {
        label: "Too many lamps",
        correct: false,
        feedback: "Not the issue here. Dark patches point to too few working lamps, not too many."
      }
    ],
    correctVerdict: "Good eye.",
    incorrectVerdict: "Have another look."
  }
];

const CLOSING = {
  verdict: "That's all three.",
  text: "You can review the page above any time, or start over to run through the questions again."
};
/* ================================================================
   NO EDITS NEEDED BELOW THIS LINE
   ================================================================ */

(function () {
  const stage      = document.getElementById("stage");
  const choices    = document.getElementById("choices");
  const fb         = document.getElementById("feedback");
  const verdict    = document.getElementById("verdict");
  const explain    = document.getElementById("explain");
  const actions    = document.getElementById("actions");
  const retryBtn   = document.getElementById("retry");
  const nextBtn    = document.getElementById("next");
  const restartBtn = document.getElementById("restart");
  const stepLabel  = document.getElementById("step-label");
  const stepDots   = document.getElementById("step-dots");
  const response   = document.querySelector(".response");

  let qi = 0;
  let cards = [];
  let locked = false;

  function drawSteps() {
    stepLabel.textContent = "Question " + (qi + 1) + " of " + QUESTIONS.length;
    stepDots.innerHTML = "";
    QUESTIONS.forEach(function (_, i) {
      const d = document.createElement("span");
      d.className = "dot" + (i < qi ? " done" : (i === qi ? " here" : ""));
      stepDots.appendChild(d);
    });
  }

  function makeCard(o, i, withImage) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.setAttribute("aria-label", withImage ? (o.label + ": " + o.alt) : o.label);

    if (withImage) {
      const img = document.createElement("img");
      img.src = o.src;
      img.alt = o.alt;
      b.appendChild(img);
    }
    const lab = document.createElement("span");
    lab.className = withImage ? "label" : "";
    lab.textContent = o.label;
    b.appendChild(lab);

    b.addEventListener("click", function () { choose(i); });
    return b;
  }

  function render() {
    const q = QUESTIONS[qi];
    document.getElementById("q-title").textContent  = q.title;
    document.getElementById("q-prompt").textContent = q.prompt;
    document.getElementById("q-hint").textContent   = q.hint || "";
    drawSteps();

    stage.innerHTML = "";
    choices.innerHTML = "";
    cards = [];
    locked = false;

    if (q.kind === "image") {
      stage.className = "stage grid3";
      choices.className = "choices hidden";
      q.options.forEach(function (o, i) {
        const c = makeCard(o, i, true);
        stage.appendChild(c);
        cards.push(c);
      });
    } else if (q.kind === "stem") {
      stage.className = "stage single";
      const holder = document.createElement("div");
      holder.className = "stem";
      const img = document.createElement("img");
      img.src = q.stem.src;
      img.alt = q.stem.alt;
      holder.appendChild(img);
      stage.appendChild(holder);
      choices.className = "choices cols3";
      q.options.forEach(function (o, i) {
        const c = makeCard(o, i, false);
        choices.appendChild(c);
        cards.push(c);
      });
    } else {
      stage.className = "stage hidden";
      choices.className = "choices";
      q.options.forEach(function (o, i) {
        const c = makeCard(o, i, false);
        choices.appendChild(c);
        cards.push(c);
      });
    }

    clearResponse();
  }

  function clearResponse() {
    fb.className = "feedback";
    actions.className = "actions";
    retryBtn.classList.add("hidden");
    nextBtn.classList.add("hidden");
    restartBtn.classList.add("hidden");
    response.classList.remove("active");
  }

  function choose(i) {
    if (locked) return;
    locked = true;
    const q = QUESTIONS[qi];
    const opt = q.options[i];

    cards.forEach(function (c, j) {
      c.classList.add("locked");
      if (j === i) {
        c.classList.add(opt.correct ? "chosen-correct" : "chosen-incorrect");
      } else {
        c.classList.add("dimmed");
      }
    });

    verdict.textContent = opt.correct ? q.correctVerdict : q.incorrectVerdict;
    explain.textContent = opt.feedback;
    fb.className = "feedback show " + (opt.correct ? "correct" : "incorrect");
    actions.className = "actions show";
    response.classList.add("active");

    if (!opt.correct) {
      retryBtn.classList.remove("hidden");
      retryBtn.focus({ preventScroll: true });
    } else if (qi < QUESTIONS.length - 1) {
      nextBtn.classList.remove("hidden");
      nextBtn.focus({ preventScroll: true });
    } else {
      restartBtn.classList.remove("hidden");
      restartBtn.focus({ preventScroll: true });
    }
  }

  function retry() {
    locked = false;
    cards.forEach(function (c) {
      c.classList.remove("locked", "dimmed", "chosen-correct", "chosen-incorrect");
    });
    clearResponse();
    cards[0].focus({ preventScroll: true });
  }

  function next() {
    qi += 1;
    render();
    cards[0].focus({ preventScroll: true });
  }

  function restart() {
    qi = 0;
    render();
    verdict.textContent = CLOSING.verdict;
    explain.textContent = CLOSING.text;
  }

  retryBtn.addEventListener("click", retry);
  nextBtn.addEventListener("click", next);
  restartBtn.addEventListener("click", restart);

  render();
})();
</script>
